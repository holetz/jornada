[project]
name = "jornada"
version = "0.2.0"
description = "Rastreio do tempo de trabalho no desktop Linux (GNOME) e banco de horas"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
]

[project.scripts]
jornada = "jornada.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jornada"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".agents", ".claude", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "DTZ"]
ignore = [
    "S603", # subprocess sem shell: os comandos são do sistema (pw-dump, gdbus)
    "S607", # caminho parcial: idem
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["desktop: precisa de uma sessão GNOME real (D-Bus, PipeWire); fora do CI"]
addopts = "-m 'not desktop'"
